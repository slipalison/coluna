name: CI

# A esteira compartilhada faz lint, teste com piso de cobertura, sete
# varreduras de seguranca e a versao semantica tirada dos commits. O que este
# arquivo acrescenta e o unico passo que so existe aqui: publicar o pacote.
#
# POR QUE A PUBLICACAO E UM JOB DAQUI, E NAO UM GATILHO SEPARADO
# --------------------------------------------------------------
# O caminho obvio seria `on: release: published`, reagindo a release que o
# `lancar` cria. Ele nao funciona: release criada com o GITHUB_TOKEN nao
# dispara outro workflow. Entao a versao tem de ser consumida no MESMO run em
# que foi calculada — e por isso o `pipeline.yml` expoe `versao` como saida.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  esteira:
    # Um workflow reutilizavel nunca recebe mais permissao do que o chamador
    # concede aqui. `contents: write` e para a tag e a release do `lancar`.
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read
    uses: slipalison/github-workflows/.github/workflows/pipeline.yml@main
    with:
      componentes: '[{"nome":"coluna","linguagem":"node","cobertura":80}]'
      # 0.x de proposito: um design system em formacao muda contrato de
      # componente, e semver manda dizer isso com o numero em vez de fingir
      # estabilidade que ainda nao existe.
      versao_inicial: "0.1.0"
      # Sem imagem: isto e um pacote, nao um servico. Sem `app`: nao ha deploy
      # no GitOps. Os dois jobs sao pulados, e o `portao` aceita pulado.
      #
      # Sonar entra quando o projeto existir no SonarCloud. Apontar para um
      # projectKey inexistente reprova a esteira inteira com um erro que nao
      # fala de codigo nenhum.
      sonar_projeto: ""
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  pacote:
    needs: esteira
    # `salto == nenhum` significa que o HEAD ja estava tageado — run repetido,
    # push sem commit novo. Nao ha versao nova para publicar, e pular e o
    # resultado certo. O `npm.yml` confere de novo contra o registro; esta
    # condicao so evita gastar um job para descobrir isso.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.esteira.outputs.versao != ''
      && needs.esteira.outputs.salto != 'nenhum'
    permissions:
      contents: read
      packages: write
    uses: slipalison/github-workflows/.github/workflows/npm.yml@main
    with:
      versao: ${{ needs.esteira.outputs.versao }}

  # ------------------------------------------------------------------------
  # O catalogo. Vai para o GitHub Pages porque ele precisa de URL permanente:
  # um link que muda a cada publicacao nao serve para revisar componente com
  # outra pessoa, que e a unica razao de o catalogo existir.
  catalogo:
    needs: esteira
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      # OIDC: o `deploy-pages` troca este token por uma credencial de curta
      # duracao em vez de guardar segredo no repositorio.
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Preparar
        uses: slipalison/github-workflows/.github/actions/preparar@main
        with:
          linguagem: node

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: Construir o catalogo
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"
        run: npm run build-storybook

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: storybook-static

      - name: Publicar
        id: publicar
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
